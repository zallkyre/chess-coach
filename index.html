<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Coach Mode — chess with Ray</title>
<link rel="icon" type="image/png" href="assets/icon.png">
<link rel="apple-touch-icon" href="assets/icon.png">
<meta name="theme-color" content="#1b2231">
<style>
  :root{
    --bg:#312e2b;
    --card:#262421;
    --card2:#34322f;
    --line:#3d3b38;
    --text:#e9e6e2;
    --muted:#a09c96;
    --sq-light:#eeeed2;
    --sq-dark:#769656;
    --sel:rgba(255,255,51,.42);
    --accent:#81b64c;
    --best:#81b64c; --excellent:#95b776; --good:#a3b98a;
    --inacc:#f7c045; --mistake:#e58f2a; --blunder:#ca3431; --forced:#8b8985;
  }
  *{box-sizing:border-box}
  body{
    margin:0; color:var(--text); font:14px/1.55 "Segoe UI",system-ui,-apple-system,sans-serif;
    background:var(--bg);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1200px;margin:0 auto;padding:14px 20px 48px}
  header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}

  .hero{
    position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--line);
    margin-bottom:12px;background:var(--card);
  }
  .hero-bg{display:none}
  .hero:after{display:none}
  .hero-in{position:relative;z-index:2;display:flex;align-items:center;gap:13px;padding:15px 17px}
  .hero-icon{width:46px;height:46px;border-radius:11px;box-shadow:0 6px 18px rgba(0,0,0,.5);display:block}
  .hero-txt h1{margin:0;font-size:16px;letter-spacing:.16em;text-transform:uppercase;color:#fff}
  .hero-txt p{margin:2px 0 0;font-size:11.5px;color:#9aa3b5;letter-spacing:.02em}

  .app{display:flex;gap:20px;align-items:flex-start;justify-content:center}

  /* board column */
  .left{display:flex;flex-direction:column;gap:9px;flex:0 0 auto;width:min(76vmin,570px)}
  .turnbar{
    display:flex;align-items:center;gap:10px;height:38px;padding:0 14px;
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    font-size:13px;font-weight:600;
  }
  .turnbar .dot2{width:9px;height:9px;border-radius:50%;background:var(--accent);
                 box-shadow:0 0 12px rgba(126,201,107,.8)}
  .turnbar.thinking .dot2{background:#dfbe57;box-shadow:0 0 12px rgba(223,190,87,.8);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.35}}
  .turnbar .sub{margin-left:auto;font-weight:400;color:var(--muted);font-size:12px}

  .boardrow{display:flex;gap:8px;align-items:stretch;width:100%}
  .evalbar{
    width:18px;flex:0 0 18px;border-radius:6px;background:#0a0c11;border:1px solid var(--line);
    display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;position:relative;
  }
  .evalbar .fill{background:linear-gradient(180deg,#f4f6fa,#c6cedd);height:50%;transition:height .25s ease}
  .evalbar .val{display:none}

  .boardwrap{position:relative;flex:1 1 auto;min-width:0}
  .board{
    width:100%;aspect-ratio:1 / 1;height:auto;
    display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);
    border-radius:6px;overflow:hidden;user-select:none;touch-action:none;
    box-shadow:0 22px 55px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.05);
  }
  .sq{position:relative;display:flex;align-items:center;justify-content:center;cursor:default}
  .sq.light{background:var(--sq-light)}
  .sq.dark{background:var(--sq-dark)}
  .sq.last{box-shadow:inset 0 0 0 999px rgba(186,202,68,.41)}
  .sq.sel{box-shadow:inset 0 0 0 999px rgba(255,255,51,.42)}
  .sq.hover{box-shadow:inset 0 0 0 999px rgba(255,255,255,.22)}
  .sq.chk{background:radial-gradient(circle,rgba(221,90,90,.95) 14%,transparent 70%) var(--sq-light)}
  .sq.dark.chk{background:radial-gradient(circle,rgba(221,90,90,.95) 14%,transparent 70%) var(--sq-dark)}

  .piece{width:94%;height:94%;pointer-events:none;position:relative;z-index:3;will-change:transform}
  .piece svg{width:100%;height:100%;display:block}
  .piece.drag{z-index:30;pointer-events:none;transform:scale(1.12);filter:drop-shadow(0 8px 12px rgba(0,0,0,.5))}

  .dot{position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(20,20,20,.22);z-index:2}
  .dot.cap{width:100%;height:100%;border-radius:0;background:transparent;
           box-shadow:inset 0 0 0 5px rgba(18,24,18,.30)}
  .coord{position:absolute;font:700 9px/1 ui-monospace,monospace;pointer-events:none}
  .sq.light .coord{color:rgba(70,90,50,.6)}
  .sq.dark .coord{color:rgba(240,244,225,.65)}
  .coord.file{bottom:2px;right:3px}
  .coord.rank{top:2px;left:3px}

  #arrows{position:absolute;inset:0;z-index:2;pointer-events:none}
  .badge{
    position:absolute;z-index:8;padding:2px 6px;border-radius:5px;
    font:800 10px/1.5 ui-monospace,monospace;text-transform:uppercase;white-space:nowrap;
    color:#0d1117;box-shadow:0 4px 12px rgba(0,0,0,.45);animation:pop .18s ease-out;
  }
  @keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
  .badge.best{background:var(--best)} .badge.excellent{background:var(--excellent)}
  .badge.good{background:var(--good)} .badge.inaccuracy{background:var(--inacc)}
  .badge.mistake{background:var(--mistake)} .badge.blunder{background:var(--blunder);color:#fff}
  .badge.forced{background:var(--forced);color:#fff}

  .promo{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
         background:rgba(8,10,14,.72);border-radius:6px}
  .promo.on{display:flex}
  .promo .box{display:flex;gap:10px;background:var(--card);padding:12px;border-radius:12px;border:1px solid var(--line)}
  .promo button{width:56px;height:56px;padding:6px;background:var(--sq-light);border:none;border-radius:8px;cursor:pointer}
  .promo button:hover{background:#fff}

  /* right panel */
  .panel{flex:1 1 330px;max-width:380px;min-width:290px;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px}
  .coach{display:flex;gap:11px;align-items:flex-start}
  .avatar{width:46px;height:46px;flex:0 0 46px;border-radius:50%;overflow:hidden;border:1px solid #3a4459}
  .whorow{display:flex;align-items:center;gap:7px;margin-bottom:4px}
  .whorow b{font-size:13px}
  .lvl{font:800 9px/1 ui-monospace,monospace;letter-spacing:.1em;padding:3px 6px;border-radius:4px;
       background:var(--accent);color:#0d1117}
  .eng{font:700 9px/1 ui-monospace,monospace;letter-spacing:.09em;text-transform:uppercase;color:#68718a}
  .eng.on{color:var(--accent)}
  .bubble{background:#0e1117;border:1px solid var(--line);border-radius:9px;padding:9px 11px;
          font-size:12.8px;min-height:58px;color:#dce2ec}

  .rate{display:flex;gap:9px;align-items:center;padding:10px 12px;background:#0e1117;
        border:1px solid var(--line);border-radius:11px;min-height:48px}
  .chip{font:800 10px/1 ui-monospace,monospace;letter-spacing:.07em;text-transform:uppercase;
        padding:6px 8px;border-radius:5px;background:#2a3040;color:#a8b1c2;flex:0 0 auto}
  .rate .txt{font-size:12.2px;color:var(--muted)}
  .rate .txt b{color:var(--text)}

  .progress{height:4px;border-radius:2px;background:#222836;overflow:hidden;margin-top:8px;display:none}
  .progress.on{display:block}
  .progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}

  .btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
  .btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border-radius:6px;
       border:1px solid var(--line);background:var(--card2);color:var(--text);
       font:700 12.5px/1 inherit;cursor:pointer;transition:.13s}
  .btn:hover:not(:disabled){background:#2c3242;border-color:#3f4a60}
  .btn:disabled{opacity:.38;cursor:not-allowed}
  .btn.primary{background:var(--accent);color:#fff;border-color:transparent;grid-column:1/-1;box-shadow:0 2px 0 #5d8636}
  .btn.primary:hover{background:#8fc45a}

  .moves{height:168px;overflow-y:auto;background:#21201d;border:1px solid var(--line);
         border-radius:6px;font:600 13px/1.85 "Segoe UI",system-ui,sans-serif;padding:2px 0}
  .mv{display:grid;grid-template-columns:28px 1fr 1fr;padding:0 7px}
  .mv:nth-child(odd){background:rgba(255,255,255,.02)}
  .mv .n{color:#7e7a74;font-weight:400;font-size:12px}
  .mv .m{cursor:pointer;border-radius:4px;padding:0 5px;display:flex;align-items:center;gap:4px;color:#e9e6e2}
  .mv .m:hover{background:#34322f}
  .mv .m.cur{background:#3f3d3a}
  .mv .g{font-size:9px;font-weight:800}
  .fig{font-size:15px;line-height:1;color:#f0ece6}
  .g.best{color:var(--best)} .g.excellent{color:var(--excellent)} .g.good{color:var(--good)}
  .g.inaccuracy{color:var(--inacc)} .g.mistake{color:var(--mistake)} .g.blunder{color:var(--blunder)}
  .g.forced{color:var(--forced)}

  .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .row label{font-size:12px;color:var(--muted)}
  select{background:#0e1117;color:var(--text);border:1px solid var(--line);border-radius:7px;
         padding:6px 8px;font-size:12.3px;cursor:pointer}
  .chat{display:flex;gap:6px}
  .chat input{flex:1;background:#0e1117;border:1px solid var(--line);border-radius:7px;
              color:var(--text);padding:8px 10px;font-size:12.3px;outline:none}
  .chat input:focus{border-color:#46506a}
  .chat button{background:var(--card2);border:1px solid var(--line);color:var(--text);
               border-radius:7px;padding:0 11px;cursor:pointer;font-weight:600;font-size:12px}
  .chat button:hover{background:#2c3242}
  .keyrow{display:flex;gap:6px;align-items:center;margin-top:6px}
  .keyrow input{flex:1;min-width:0;background:#0b0e13;border:1px solid #262c38;border-radius:7px;
                color:var(--muted);padding:6px 9px;font:11px ui-monospace,monospace;outline:none}
  .keyrow input:focus{border-color:#46506a;color:var(--text)}
  .kstat{font:700 9px/1 ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;
         color:#68718a;white-space:nowrap}
  .kstat.on{color:var(--accent)}

  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;
     background:linear-gradient(90deg,#4b8f6a,#7ec96b 45%,#dfbe57 70%,#dd5a5a);}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-5px;
     border-radius:50%;background:#fff;border:2px solid #101319;box-shadow:0 1px 4px rgba(0,0,0,.5)}
  input[type=range]::-moz-range-track{height:6px;border-radius:3px;
     background:linear-gradient(90deg,#4b8f6a,#7ec96b 45%,#dfbe57 70%,#dd5a5a)}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid #101319}
  .dv{font:700 10.5px/1 ui-monospace,monospace;letter-spacing:.05em;text-transform:uppercase;color:var(--text)}

  /* settings */
  .settings summary{
    list-style:none;cursor:pointer;font:700 11px/1 ui-monospace,monospace;letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted);padding:4px 2px;display:flex;align-items:center;gap:7px;
  }
  .settings summary::-webkit-details-marker{display:none}
  .settings summary:before{content:"▸";font-size:10px;transition:.15s;color:var(--accent)}
  .settings[open] summary:before{transform:rotate(90deg)}
  .settings[open] summary{color:var(--text);margin-bottom:8px}
  .setgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px 10px;margin-bottom:9px}
  .sw{display:flex;align-items:center;gap:7px;font-size:11.5px;color:#c3cad8;cursor:pointer;user-select:none}
  .sw input{display:none}
  .sw span{
    width:26px;height:15px;border-radius:99px;background:#2a3140;position:relative;flex:0 0 26px;transition:.15s;
    border:1px solid #363e50;
  }
  .sw span:after{
    content:"";position:absolute;top:1px;left:1px;width:11px;height:11px;border-radius:50%;
    background:#6b7488;transition:.15s;
  }
  .sw input:checked + span{background:rgba(126,201,107,.25);border-color:#4d7a44}
  .sw input:checked + span:after{transform:translateX(11px);background:var(--accent)}
  .themerow{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted)}
  .theme-dot{
    width:24px;height:24px;border-radius:6px;border:1px solid #3a4256;cursor:pointer;padding:0;
    background:linear-gradient(135deg,var(--a) 0 50%,var(--b) 50% 100%);
  }
  .theme-dot.on{outline:2px solid var(--accent);outline-offset:1px}

  .brain{border-top:1px solid var(--line);margin-top:9px;padding-top:9px;display:flex;flex-direction:column;gap:6px}
  .brainhead{display:flex;align-items:center;justify-content:space-between;font:700 10px/1 ui-monospace,monospace;
             letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .prow{display:flex;gap:6px}
  .prow select{flex:0 0 42%;min-width:0}
  .prow input{flex:1;min-width:0;background:#0b0e13;border:1px solid #262c38;border-radius:7px;
              color:var(--text);padding:6px 9px;font:11px ui-monospace,monospace;outline:none}
  .prow input:focus{border-color:#46506a}
  .btn.sm{padding:0 10px;font-size:11px;flex:0 0 auto;border-radius:7px}
  .pnote{font:11px/1.4 -apple-system,system-ui,sans-serif;color:#68718a}

  /* board themes */
  .board.theme-green{--sq-light:#eeeed2;--sq-dark:#769656}
  .board.theme-blue{--sq-light:#dee3ed;--sq-dark:#4b7399}
  .board.theme-walnut{--sq-light:#f0d9b5;--sq-dark:#b58863}
  .board.theme-slate{--sq-light:#d5d8dc;--sq-dark:#5b6777}
  .board.hide-coords .coord{display:none}

  .capstrip{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    height:24px;padding:0 2px;font:700 10px/1 ui-monospace,monospace;color:#8d96a8;
  }
  .capstrip .side{display:flex;align-items:center;gap:2px;min-width:0;overflow:hidden}
  .capstrip svg{width:16px;height:16px;display:block;opacity:.9}
  .capstrip .adv{color:var(--accent);font-weight:800}
  .moves .empty{color:#5b6478;font:12px/1.6 -apple-system,system-ui,sans-serif;padding:8px 10px}
  .hintline{font-size:11px;color:#68718a;text-align:center}
  kbd{background:#0e1117;border:1px solid var(--line);border-radius:4px;padding:1px 4px;
      font:700 10px ui-monospace,monospace;color:#a8b1c2}

  @media (max-width:930px){
    .app{flex-direction:column;align-items:center}
    .panel{max-width:none;width:min(92vw,570px)}
    .left{width:min(92vw,570px)}
    .tag{display:none}
  }

  /* ---- liquid glass: translucent panels over a soft green ambient ---- */
  body{
    background:
      radial-gradient(900px 620px at 18% -8%, rgba(118,150,86,.16), transparent 62%),
      radial-gradient(800px 560px at 100% 106%, rgba(70,110,90,.14), transparent 60%),
      #1e211d !important;
  }
  .card,.turnbar,.hero,.rate,.boardwrap,.panel .card{
    background:rgba(36,41,35,.58) !important;
    -webkit-backdrop-filter:blur(20px) saturate(1.35);
    backdrop-filter:blur(20px) saturate(1.35);
    border:1px solid rgba(255,255,255,.10) !important;
    border-radius:18px !important;
    box-shadow:0 16px 40px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.10) !important;
  }
  .hero{border-radius:20px !important}
  .btn{border-radius:14px !important;background:rgba(255,255,255,.09) !important;
       border:1px solid rgba(255,255,255,.12) !important}
  .btn:hover:not(:disabled){background:rgba(255,255,255,.16) !important}
  .btn.primary{background:linear-gradient(180deg,#8ec95a,#6fa83d) !important;
               border-color:rgba(255,255,255,.18) !important;color:#10250c !important}
  .bubble,.rate,.moves{background:rgba(12,16,12,.42) !important;
                       border:1px solid rgba(255,255,255,.08) !important;border-radius:14px !important}
  .board{box-shadow:0 24px 60px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.10) !important;
         border-radius:8px !important}
  .piece.ghost{position:fixed;pointer-events:none;z-index:99;will-change:transform;
               filter:drop-shadow(0 8px 10px rgba(0,0,0,.45))}

  /* rating badge: bottom-left of the circle sits on the destination square's
     top-right corner, so it straddles the four squares like chess.com */
  .badge{
    position:absolute;right:-23px;top:-23px;width:31px;height:31px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font:800 12px/1 ui-monospace,monospace;letter-spacing:0;color:#fff;
    border:2px solid rgba(0,0,0,.42);z-index:9;white-space:nowrap;padding:0;
    box-shadow:0 3px 9px rgba(0,0,0,.45),inset 0 -2px 6px rgba(0,0,0,.25);
    animation:pop .16s ease-out;
  }
  .sq.hint{box-shadow:inset 0 0 0 4px #81b64c}
  .chip{width:32px;height:32px;padding:0;border-radius:50%;display:inline-flex;
        align-items:center;justify-content:center;font:800 11px/1 ui-monospace,monospace;
        color:#fff;border:2px solid rgba(0,0,0,.38);
        box-shadow:inset 0 -3px 8px rgba(0,0,0,.28),0 3px 8px rgba(0,0,0,.35)}

  /* mobile: real blur is too expensive in a WebView; use tinted glass instead */
  @media (max-width: 930px){
    .card,.turnbar,.hero,.rate,.boardwrap,.panel .card{
      -webkit-backdrop-filter:none !important; backdrop-filter:none !important;
      background:rgba(34,39,33,.90) !important;
      box-shadow:0 8px 22px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.08) !important;
    }
    .board{contain:layout paint}
    .moves .m{transition:none}
  }

  /* premove: red on the two squares, chess.com style */
  .sq.pre{box-shadow:inset 0 0 0 999px rgba(214,64,52,.45)}

/* badge icons: white vector glyphs on the chess.com coloured disc */
.badge svg{width:66%;height:66%;display:block;fill:#fff;stroke:none}
.badge.book svg{fill:none;stroke:#fff;stroke-width:6;stroke-linejoin:round}

  /* badge art: the actual icon files, cropped to a disc */
  .badge{background:none !important;border:none !important;box-shadow:none !important;
         width:34px;height:34px;border-radius:50%;overflow:hidden;padding:0;
         right:-26px;top:-26px}
  .badge img{width:100%;height:100%;display:block}
  .chip{background:transparent !important;border:none !important;
        box-shadow:none !important;width:34px;height:34px;overflow:hidden;padding:0}
  .chip img{width:100%;height:100%;display:block}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="hero-in">
      <img class="hero-icon" src="assets/icon-256.png" alt="">
      <div class="hero-txt">
        <h1>Chess Coach</h1>
        <p>play · learn · Ray</p>
      </div>
    </div>
  </header>

  <div class="app">
    <div class="left">
      <div class="turnbar" id="turnbar">
        <span class="dot2"></span>
        <span id="turnText">Starting engine…</span>
        <span class="sub" id="turnSub"></span>
      </div>
      <div class="boardrow">
        <div class="evalbar" title="Evaluation">
          <div class="fill" id="evalFill"></div>
          <div class="val" id="evalVal">0.0</div>
        </div>
        <div class="boardwrap">
          <div class="board theme-green" id="board"></div>
          <svg id="arrows" viewBox="0 0 800 800" preserveAspectRatio="none">
            <g id="threatG"></g>
            <g id="liveG"></g>
            <g id="hintG"></g>
          </svg>
          <div class="promo" id="promo"><div class="box" id="promoBox"></div></div>
        </div>
      </div>
      <div class="capstrip" id="capstrip"></div>
    </div>

    <div class="panel">
      <div class="card coach">
        <div class="avatar" id="avatar"></div>
        <div style="flex:1;min-width:0">
          <div class="whorow">
            <b>Ray</b>
            <span class="lvl" id="lvlTag">CLUB</span>
            <span class="eng" id="eng">starting</span>
          </div>
          <div class="bubble" id="say">Booting stockfish. I'm not fast, I'm honest.</div>
        </div>
      </div>

      <div class="rate">
        <div class="chip" id="chip">ready</div>
        <div style="flex:1;min-width:0">
          <div class="txt" id="rateTxt">Make a move — I'll rate it instantly.</div>
          <div class="progress" id="prog"><i id="progBar"></i></div>
        </div>
      </div>

      <div class="card">
        <div class="btns">
          <button class="btn" id="hintBtn">💡 Hint</button>
          <button class="btn" id="undoBtn">↶ Revert</button>
          <button class="btn" id="flipBtn">⇅ Flip</button>
          <button class="btn primary" id="newBtn">New game</button>
        </div>
      </div>

/* ---------------- engine ---------------- */
/* Stockfish still runs in vendor/stockfish.js on its own Worker, so the board

   a serial queue with cancellation, streamed info lines, a FEN-keyed
   transposition cache and an FEN-indexed opening book. */
const ENGINE = ChessEngine.create('vendor/stockfish.js', { hash: 32, cacheSize: 2048 });
let engineReady = false;

function setEng(on){
  const el = document.getElementById('eng');
  if (!el) return;
  const live = typeof on === 'string';
  el.textContent = live ? on : (on ? 'engine ready' : 'engine off');
  el.className = 'eng' + ((live || on) ? ' on' : '');
}

function initEngine(){
  return ENGINE.init().then(() => {
    engineReady = true;
    setEng(true);
    setSkill(difficulty());
  });
}

function setSkill(n){ ENGINE.setSkill(n); }

function fmtNps(n){
  if (!n) return '';
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M nps';
  if (n >= 1e3) return Math.round(n / 1e3) + 'k nps';
  return n + ' nps';
}

/* Every `info depth` line lands here while the search is still running: the bar
   slides, the arrow follows the principal variation, the pill shows depth. */
function liveInfo(info, fen){
  if (fen !== game.fen()) return;                 // a search for another position
  if (info.cp !== undefined || info.mate !== undefined) paintEval(evalWhite(info, fen));
  if (info.depth) setEng('depth ' + info.depth + (info.nps ? ' · ' + fmtNps(info.nps) : ''));
}

function clearLive(){
  const g = document.getElementById('liveG');
  if (g) g.innerHTML = '';
}

/* One bounded search. Always resolves, never hangs the queue.
   depth > 0 -> fixed depth. depth 0 -> movetime (what live play uses, so a
   hard position shortens the think instead of freezing the board).
   The client answers from its FEN cache when it already knows the position. */
function analyze(fen, depth, capMs, onlyMove, opts){
  const o = opts || {};
  return ENGINE.search(fen, {
    depth: depth > 0 ? depth : 0,
    movetime: depth > 0 ? 0 : (capMs || 300),
    searchmoves: onlyMove || null,
    minCachedDepth: o.minCachedDepth,
    fresh: !!o.fresh,
    onInfo: (info) => liveInfo(info, fen)
  }).then((res) => {
    clearLive();
    setEng(res.cached ? ('cached · d' + (res.depth || 0)) : true);
    return res;
  });
}

function engineMove(){
  const d = difficulty();

  // opening book first: the reply is a lookup, not a search, so it is 0 ms
  if (d >= 3){
    const b = ENGINE.book(game.fen());
    if (b){
      setEng('book · ' + b.name);
      return Promise.resolve(b.uci);
    }
  }

  // eval streams while Ray thinks; the pv stays hidden so the move is a surprise
  return ENGINE.play(game.fen(), {
    skill: d, movetime: moveTimeMs(),
    onInfo: (i) => {
      if (i.cp !== undefined || i.mate !== undefined) paintEval(evalWhite(i, game.fen()));
      if (i.depth) setEng('depth ' + i.depth);
    }
  }).then((res) => {
    setEng(res.cached ? ('cached · d' + (res.depth || 0)) : true);
    let mv = res.best;
    if (!mv || mv === '(none)') return null;

    // low levels get a small human-error layer on top of Stockfish's damping
    if (d <= 6 && Math.random() < (7 - d) * 0.025){
      const legal = game.moves({ verbose: true });
      if (legal.length){
        const r = legal[Math.floor(Math.random() * legal.length)];
        mv = r.from + r.to + (r.promotion || '');
      }
    }
    return mv;
  });
}

function evalWhite(res, fen){
  const turn = fen.split(' ')[1];
  let v;
  if (res.mate !== null && res.mate !== undefined)
    v = res.mate > 0 ? 10000 - Math.abs(res.mate) * 10 : -10000 + Math.abs(res.mate) * 10;
  else v = res.cp || 0;
  return turn === 'w' ? v : -v;
}
const playerPov = (w) => playerColor === 'w' ? w : -w;

function fmt(w){

  return (p > 0 ? '+' : '') + p.toFixed(1);
}
let _evalAt = 0;
function paintEval(w){
  const now = performance.now();

  document.getElementById('evalFill').style.height = (50 + p * 50).toFixed(1) + '%';
  updateSub();
}

function buildBoard(){
  boardEl.innerHTML = '';
  for (let r = 0; r < 8; r++){
    for (let c = 0; c < 8; c++){
      const fileIdx = orientation === 'w' ? c : 7 - c;
      const rankIdx = orientation === 'w' ? r : 7 - r;
      const name = sqName(fileIdx, rankIdx);
      const d = document.createElement('div');
      d.className = 'sq ' + ((fileIdx + rankIdx) % 2 === 0 ? 'light' : 'dark');
      d.dataset.sq = name;
      if (rankIdx === 7){
        const t = document.createElement('div');
        t.className = 'coord file'; t.textContent = FILES[fileIdx]; d.appendChild(t);
      }
      if (fileIdx === 0){
        const t = document.createElement('div');
        t.className = 'coord rank'; t.textContent = String(8 - rankIdx); d.appendChild(t);
      }
      boardEl.appendChild(d);
    }
  }
}

function render(){
  const cells = boardEl.children;
  const grid = game.board();
  const kingSq = game.in_check() ? findKing(game.turn()) : null;

  for (const cell of cells){
    const sq = cell.dataset.sq;
    cell.querySelectorAll('.piece,.dot').forEach(n => n.remove());
    cell.classList.remove('sel','last','chk','hover','hint');

    const fileIdx = FILES.indexOf(sq[0]);
    const row = 8 - parseInt(sq[1], 10);
    const p = grid[row][fileIdx];
    if (p){
      const el = document.createElement('div');
      el.className = 'piece ' + p.color;
      el.dataset.piece = p.type + p.color;
      el.innerHTML = pieceSvg(p.type, p.color);
      cell.appendChild(el);
    }
    if (lastMove && (sq === lastMove.from || sq === lastMove.to)) cell.classList.add('last');
    if (kingSq === sq) cell.classList.add('chk');
    if (selected === sq) cell.classList.add('sel');
    if (premove && (sq === premove.from || sq === premove.to)) cell.classList.add('pre');
    if (selected && SETTINGS.dots){
      const mv = legalForSel.find(m => m.to === sq);
      if (mv){
        const d = document.createElement('div');
        d.className = 'dot' + ((mv.flags.includes('c') || mv.flags.includes('e')) ? ' cap' : '');
        cell.appendChild(d);
      }
    }
  }
  document.getElementById('turnText').textContent = turnLabel();
  updateSub();
  renderThreats();
  renderCaptured();
  maybeRunPremove();
}

function findKing(color){
  const g = game.board();
  for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++){
    const p = g[r][c];
    if (p && p.type === 'k' && p.color === color) return FILES[c] + (8 - r);
  }
  return null;
}

function sqCenter(sq){
  const f = FILES.indexOf(sq[0]);

  const col = orientation === 'w' ? f : 7 - f;
  const row = orientation === 'w' ? 8 - rank : rank - 1;
  return { x: col * 100 + 50, y: row * 100 + 50 };
}

function drawArrow(from, to, opts){
  const o = opts || {};
  const group = document.getElementById(o.group || 'hintG');
  if (!group) return;
  if (o.clear !== false) group.innerHTML = '';
  const a = sqCenter(from), b = sqCenter(to);
  const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy);
  if (len < 1) return;
  const ux = dx / len, uy = dy / len, head = o.head || 30;
  const ex = b.x - ux * head, ey = b.y - uy * head;
  const color = o.color || '#7ec96b';
  const ns = 'http://www.w3.org/2000/svg';
  const line = document.createElementNS(ns,'line');
  line.setAttribute('x1', a.x + ux*24); line.setAttribute('y1', a.y + uy*24);
  line.setAttribute('x2', ex); line.setAttribute('y2', ey);
  line.setAttribute('stroke', color); line.setAttribute('stroke-width', o.width || 16);
  line.setAttribute('stroke-linecap','round'); line.setAttribute('opacity', o.opacity || .85);
  const poly = document.createElementNS(ns,'polygon');
  poly.setAttribute('points', `${b.x},${b.y} ${ex-uy*18},${ey+ux*18} ${ex+uy*18},${ey-ux*18}`);
  poly.setAttribute('fill', color); poly.setAttribute('opacity', o.opacity || .92);
  group.append(line, poly);
  if (o.ttl && o.group !== 'threatG'){
    setTimeout(() => { if (group.childNodes.length) group.innerHTML = ''; }, o.ttl);
  }
}
function clearArrow(){
  document.getElementById('hintG').innerHTML = '';
  const live = document.getElementById('liveG');
  if (live) live.innerHTML = '';
}

/* --------- threat map: what the engine side is attacking right now --------- */
let _threatFen = null;
function renderThreats(){
  if (_threatFen === game.fen()) return;
  _threatFen = game.fen();
  const g = document.getElementById('threatG');
  if (!g) return;
  g.innerHTML = '';
  if (!SETTINGS.threats || gameOver || reviewing) return;

  const enemy = playerColor === 'w' ? 'b' : 'w';
  const f = game.fen().split(' ');
  let probe;
  try {
    probe = new Chess([f[0], enemy, f[2], '-', f[4], f[5]].join(' '));
  } catch (e){ return; }

  const targets = [];
  const b = probe.board();
  for (let r = 0; r < 8; r++){
    for (let c = 0; c < 8; c++){
      const p = b[r][c];
      if (!p || p.color !== enemy) continue;
      const from = FILES[c] + (8 - r);
      let mv;
      try { mv = probe.moves({ square: from, verbose: true }); } catch (e){ continue; }
      for (const m of mv){
        const victim = game.get(m.to);
        if (victim && victim.color === playerColor) targets.push([from, m.to]);
      }
    }
  }
  // most valuable victim first, and don't draw a wall of arrows
  const val = { p:1, n:3, b:3, r:5, q:9, k:0 };
  targets.sort((A, B) => val[(game.get(B[1])||{}).type] - val[(game.get(A[1])||{}).type]);
  for (const [from, to] of targets.slice(0, 8)){
    drawArrow(from, to, { group: 'threatG', color: '#ca3431', opacity: .38, width: 10, head: 22 });
  }
}

/* --------- captured material --------- */
const PIECE_VAL = { p:1, n:3, b:3, r:5, q:9, k:0 };

let _capFen = null;
function renderCaptured(){
  if (_capFen === game.fen()) return;
  _capFen = game.fen();
  const el = document.getElementById('capstrip');
  if (!el) return;
  const start = { p:8, n:2, b:2, r:2, q:1 };
  const have = { w:{}, b:{} };
  for (const row of game.board()) for (const p of row) if (p) have[p.color][p.type] = (have[p.color][p.type]||0)+1;

  const lost = { w:[], b:[] };
  let score = { w:0, b:0 };
  for (const col of ['w','b']) for (const t in start){
    const n = Math.max(0, start[t] - (have[col][t]||0));
    for (let i = 0; i < n; i++) lost[col].push(t);
    score[col] += n * PIECE_VAL[t];
  }
  // what you captured = pieces the enemy lost
  const mine = lost[playerColor === 'w' ? 'b' : 'w'];
  const theirs = lost[playerColor];
  const diff = score[playerColor === 'w' ? 'b' : 'w'] - score[playerColor];

  const icon = (t, c) => `<svg viewBox="0 0 100 100">${'<g fill="' + (c==='w'?'#f7f9fc':'#2a3040') + '" stroke="' + (c==='w'?'#20262f':'#0b0e13') + '" stroke-width="2.6">' + SHAPES[t] + '</g>'}</svg>`;
  const enemyCol = playerColor === 'w' ? 'b' : 'w';

  el.innerHTML =
    `<div class="side" title="pieces you took">${mine.map(t => icon(t, enemyCol)).join('')}</div>` +
    `<div class="adv">${diff > 0 ? '+' + diff : diff < 0 ? diff : '—'}</div>` +
    `<div class="side" style="justify-content:flex-end" title="pieces you lost">${theirs.map(t => icon(t, playerColor)).join('')}</div>`;
}

function badgeAt(sq, cls){
  document.querySelectorAll('.badge').forEach(b => b.remove());
  const cell = boardEl.querySelector(`[data-sq="${sq}"]`);
  if (!cell) return;
  const el = document.createElement('div');
  el.className = 'badge ' + cls;
  el.innerHTML = badgeImg(cls);
  el.title = LABEL[cls];
  cell.appendChild(el);
  setTimeout(() => el.remove(), 2400);
}


/* ---------------- premove ---------------- */
/* While Ray thinks, you may set your next move. It is validated against a copy
   of the position with your side to move, then played the instant he replies.
   Dragging the same from/to again cancels it. */
function premoveBoard(){
  const f = game.fen().split(' ');
  f[1] = playerColor;
  f[3] = '-';
  return new Chess(f.join(' '));
}
function isPremoveTurn(){
  return !gameOver && !reviewing && game.turn() !== playerColor && rayMode() === 'off';
}
function setPremove(from, to, promo){
  if (premove && premove.from === from && premove.to === to){
    premove = null;
    say('premove cancelled.');
  } else {
    premove = { from: from, to: to, promo: promo || 'q' };
    say('premove set. if he walks into it, that happens.');
  }
  selected = null; legalForSel = []; render();
}

let _preQueued = false;
/* render() is the one place every move path passes through, so the premove
   fires from here without touching each reply branch. */
function maybeRunPremove(){
  if (!premove || _preQueued || busy || gameOver || reviewing) return;
  if (game.turn() !== playerColor) return;
  _preQueued = true;
  setTimeout(() => { _preQueued = false; tryPremove(); }, 30);
}

function tryPremove(){
  if (!premove) return false;
  const p = premove;
  premove = null;
  if (game.game_over() || game.turn() !== playerColor) { render(); return false; }
  const mv = game.moves({ verbose: true })
    .find(m => m.from === p.from && m.to === p.to &&
               (!m.promotion || m.promotion === p.promo));
  if (!mv){ render(); return false; }
  commitMove(p.from, p.to, p.promo, false);
  return true;
}

/* ---------------- input: click + drag ---------------- */
boardEl.addEventListener('pointerdown', onDown);
window.addEventListener('pointermove', onMove);
window.addEventListener('pointerup', onUp);
window.addEventListener('pointercancel', onUp);

function playerCanAct(){
  return !gameOver && !reviewing && !busy && game.turn() === playerColor && rayMode() === 'off';
}

function onDown(e){
  if (pendingPromo) return;
  const cell = e.target.closest('.sq');
  if (!cell) return;
  const sq = cell.dataset.sq;
  const piece = game.get(sq);

  if (isPremoveTurn()){
    if (selected && sq !== selected){
      const probe = premoveBoard();
      const target = probe.moves({ square: selected, verbose: true }).find(m => m.to === sq);
      if (target){ setPremove(selected, sq, target.promotion || 'q'); e.preventDefault(); return; }
    }
    if (piece && piece.color === playerColor){
      selected = sq;
      legalForSel = premoveBoard().moves({ square: sq, verbose: true });
      render();
      const pe = cell.querySelector('.piece');
      if (pe) dragging = { from: sq, el: pe, moved: false, sx: e.clientX, sy: e.clientY };
      e.preventDefault();
      return;
    }
    return;
  }

  if (playerCanAct() && piece && piece.color === playerColor){
    selected = sq;
    legalForSel = game.moves({ square: sq, verbose: true });
    render();
    const pe = cell.querySelector('.piece');
    if (pe){
      dragging = { from: sq, el: pe, moved: false, sx: e.clientX, sy: e.clientY };
      pe.classList.add('drag');
      pe.style.transform = '';
    }
    e.preventDefault();
    return;
  }

  if (selected && sq !== selected){
    const target = legalForSel.filter(m => m.to === sq);
    if (target.length){
      if (target.some(m => m.flags.includes('p')) && target.length > 1){ askPromo(selected, sq); return; }
      commitMove(selected, sq, target[0].promotion || 'q', false);
      return;
    }
  }
  if (selected === sq){ selected = null; legalForSel = []; render(); }
}

function onMove(e){
  if (!dragging) return;
  const dx = e.clientX - dragging.sx, dy = e.clientY - dragging.sy;
  if (Math.hypot(dx, dy) > 4) dragging.moved = true;
  if (!dragging.moved) return;
  dragging.el.style.transform = `translate(${dx}px,${dy}px)`;
  const under = document.elementFromPoint(e.clientX, e.clientY);
  const cell = under && under.closest ? under.closest('.sq') : null;
  boardEl.querySelectorAll('.sq.hover').forEach(c => c.classList.remove('hover'));
  if (cell && cell.parentElement === boardEl) cell.classList.add('hover');
}

function onUp(e){
  if (!dragging) return;
  const d = dragging; dragging = null;
  boardEl.querySelectorAll('.sq.hover').forEach(c => c.classList.remove('hover'));
  d.el.classList.remove('drag');
  d.el.style.transform = '';

  if (!d.moved){ render(); return; }   // treat as a click-select

  const under = document.elementFromPoint(e.clientX, e.clientY);
  const cell = under && under.closest ? under.closest('.sq') : null;
  const to = cell && cell.parentElement === boardEl ? cell.dataset.sq : null;

  if (to && to !== d.from){
    const targets = legalForSel.filter(m => m.to === to);
    if (targets.length){
      if (targets.some(m => m.flags.includes('p')) && targets.length > 1){ askPromo(d.from, to); return; }
      commitMove(d.from, to, targets[0].promotion || 'q', false);
      return;
    }
  }
  render();  // snap back
}

function askPromo(from, to){
  pendingPromo = { from, to };
  const box = document.getElementById('promoBox');
  box.innerHTML = '';
  ['q','r','b','n'].forEach(t => {
    const b = document.createElement('button');
    b.innerHTML = pieceSvg(t, 'w');
    b.onclick = () => {
      document.getElementById('promo').classList.remove('on');
      pendingPromo = null;
      commitMove(from, to, t, false);
    };
    box.appendChild(b);
  });
  document.getElementById('promo').classList.add('on');
}

/* Smooth piece slide: clone the piece, move it, and let the real one appear
   at the destination only when the clone lands. */
function ghostFor(from){
  const cell = boardEl.querySelector(`[data-sq="${from}"]`);
  const p = cell && cell.querySelector('.piece');
  if (!p) return null;
  const r = p.getBoundingClientRect();
  const g = p.cloneNode(true);
  g.classList.add('ghost');
  g.style.left = r.left + 'px';
  g.style.top = r.top + 'px';
  g.style.width = r.width + 'px';
  g.style.height = r.height + 'px';
  return g;
}

function slideGhost(g, to, done){
  const cell = to && boardEl.querySelector(`[data-sq="${to}"]`);
  if (!g || !cell){ if (g) g.remove(); if (done) done(); return; }
  const dest = cell.querySelector('.piece');
  if (dest) dest.style.visibility = 'hidden';
  const a = g.getBoundingClientRect();
  const b = cell.getBoundingClientRect();
  document.body.appendChild(g);
  requestAnimationFrame(() => {
    g.style.transition = 'transform .17s cubic-bezier(.22,.75,.2,1)';
    g.style.transform = `translate(${b.left - a.left}px, ${b.top - a.top}px)`;
  });
  setTimeout(() => {
    g.remove();
    if (dest) dest.style.visibility = '';
    if (done) done();
  }, 185);
}

/* ---------------- move flow ---------------- */
function rayMode(){ return document.getElementById('ray').value; }

function commitMove(from, to, promo, isRay){
  selected = null; legalForSel = []; clearArrow();
  hintArmed = false; hintCache = null;

  const fenBefore = game.fen();
  const onlyMove = game.moves().length === 1;
  const ghost = ghostFor(from);
  const mv = game.move({ from, to, promotion: promo || 'q' });
  if (!mv) { if (ghost) ghost.remove(); render(); return; }
  slideGhost(ghost, to);

  lastMove = { from, to };
  history.push({ san: mv.san, from, to, promotion: promo || 'q', color: mv.color,
                 cls: null, cpLoss: 0, fenBefore, onlyMove });
  renderMoves(); render();
  click(mv.flags.includes('c') ? 'cap' : 'move');

  if (isRay){
    finishTurnRay(mv);
  } else {
    gradeThenReply(mv);
  }
}

async function gradeThenReply(mv){
  if (game.game_over()){ endGame(); return; }

  const h = history[history.length - 1];
  const fenBefore = h.fenBefore;

  busy = true; statusBar('thinking');
  setRate('…', 'checking', 'hold on, looking…');

  // Grade at one root: the engine's best move, then the same position with the
  // search restricted to the move played. Same budget, same root, so tempo is
  // never counted as a mistake (this is what the desktop build does too).
  const bestRes = await analyze(fenBefore, 0, T.gradeMs);
  const uci = mv.from + mv.to + (mv.promotion || '');
  const playedRes = bestRes.best === uci
    ? bestRes
    : await analyze(fenBefore, 0, T.gradeMs, uci);

  const bestCp = bestRes.cp || 0;
  const playedCp = (playedRes && playedRes.cp !== undefined) ? playedRes.cp : bestCp;
  const isBest = bestRes.best === uci;
  const loss = Math.max(0, bestCp - playedCp);
  const cls = h.onlyMove ? 'forced' : classify(loss, isBest);
  const postWhite = mv.color === 'w' ? playedCp : -playedCp;

  h.cls = cls; h.cpLoss = loss; h.best = bestRes.best || null;
  preEval = postWhite;

  paintEval(postWhite);
  badgeAt(mv.to, cls);
  setRate(LABEL[cls], cls, cls === 'forced' ? 'Only legal move.' :
          cls === 'best' ? "Engine's top choice." :
          `Engine loss <b>-${(loss/100).toFixed(2)}</b>.`);
  react(mv, cls, bestRes);
  renderMoves();

  // Ray replies
  const reply = await engineMove();
  if (reply){
    const rf = reply.slice(0,2), rt = reply.slice(2,4), rp = reply.length > 4 ? reply[4] : 'q';
    const fenB = game.fen();
    const only = game.moves().length === 1;
    const rmv = game.move({ from: rf, to: rt, promotion: rp });
    if (rmv){
      lastMove = { from: rf, to: rt };
      history.push({ san: rmv.san, from: rf, to: rt, promotion: rp, color: rmv.color,
                     cls: 'opp', cpLoss: 0, fenBefore: fenB, onlyMove: only });
      renderMoves(); render();
      click(rmv.flags.includes('c') ? 'cap' : 'move');
    }
  }

  busy = false;
  statusBar();
  render();
  if (game.game_over()){ endGame(); return; }
  scheduleAuto();
}

async function finishTurnRay(mv){
  if (game.game_over()){ endGame(); return; }
  busy = true; statusBar('thinking');
  const reply = await engineMove();
  if (reply){
    const rf = reply.slice(0,2), rt = reply.slice(2,4), rp = reply.length > 4 ? reply[4] : 'q';
    const fenB = game.fen();
    const rmv = game.move({ from: rf, to: rt, promotion: rp });
    if (rmv){
      lastMove = { from: rf, to: rt };
      history.push({ san: rmv.san, from: rf, to: rt, promotion: rp, color: rmv.color,
                     cls: 'opp', cpLoss: 0, fenBefore: fenB, onlyMove: false });
      renderMoves(); render();
    }
  }
  busy = false; statusBar(); render();
  if (game.game_over()){ endGame(); return; }
  scheduleAuto();
}

/* Ray plays your side / both sides */
function scheduleAuto(){
  clearTimeout(autoTimer);
  if (gameOver || reviewing) return;
  const mode = rayMode();
  if (mode === 'off') return;
  if (mode === 'me' && game.turn() !== playerColor) return;

  autoTimer = setTimeout(async () => {
    if (gameOver || reviewing || busy) return;
    const mode2 = rayMode();
    if (mode2 === 'off') return;
    busy = true; statusBar('thinking');
    const mv = await engineMove();
    busy = false; statusBar();
    if (!mv) return;
    const from = mv.slice(0,2), to = mv.slice(2,4), promo = mv.length > 4 ? mv[4] : 'q';
    commitMove(from, to, promo, true);
  }, 420);
}

function streakOf(cls){
  const good = ['best','great','excellent'];
  const bad = ['blunder','mistake','miss'];
  const want = good.includes(cls) ? good : bad.includes(cls) ? bad : null;
  if (!want) return 0;
  let n = 0;
  for (let i = history.length - 1; i >= 0; i--){
    const h = history[i];
    if (h.color !== playerColor || !h.cls || h.cls === 'opp') continue;
    if (want.includes(h.cls)) n++; else break;
  }
  return n;
}

function react(mv, cls, bestRes){
  if (!SETTINGS.talk) return;
  const h = history[history.length - 1] || {};
  const uci = mv.from + mv.to + (mv.promotion || '');
  let bestSan = null;
  if (bestRes && bestRes.best && bestRes.best !== uci){
    try {
      const probe = new Chess(h.fenBefore);
      const bm = probe.move({ from: bestRes.best.slice(0,2), to: bestRes.best.slice(2,4),
                              promotion: bestRes.best.length > 4 ? bestRes.best[4] : 'q' });
      bestSan = bm ? bm.san : null;
    } catch (e){}
  }
  const ctx = {
    san: mv.san, from: mv.from, to: mv.to,
    piece: NAME[mv.piece] || 'piece',
    captured: mv.captured ? NAME[mv.captured] : null,
    check: /[+#]/.test(mv.san),
    castle: mv.flags.includes('k') || mv.flags.includes('q'),
    promo: !!mv.promotion,
    cls: cls, only: !!h.onlyMove,
    bestSan: bestSan, bestTo: bestRes && bestRes.best ? bestRes.best.slice(2,4) : null,
    lossText: ((h.cpLoss || 0) / 100).toFixed(2),
    evalCp: lastEval, moveNo: Math.floor(history.length / 2) + 1,
    streak: streakOf(cls)
  };
  say(Ray.comment(ctx));
}

function setRate(chipText, cls, html){
  const chip = document.getElementById('chip');
  const word = String(chipText || '').toLowerCase();
  const neutral = ['ready', 'booting', 'review', 'new game', 'reverted', 'done', 'review done']
    .some(w => word.startsWith(w));
  chip.innerHTML = neutral ? '•' : badgeImg(cls);
  chip.title = chipText;
  chip.style.background = 'transparent';
  chip.style.color = '#fff';
  document.getElementById('rateTxt').innerHTML = html;
}

/* ---------------- moves list ---------------- */
const GLYPH = { best:'★', excellent:'+', good:'·', inaccuracy:'?!', mistake:'?', blunder:'??', forced:'=' };
const FIG = { n:'♞', b:'♝', r:'♜', q:'♛', k:'♚' };  // figurine SAN, chess.com style

function renderMoves(){
  const el = document.getElementById('moves');
  el.innerHTML = '';
  if (!history.length){
    el.innerHTML = '<div class="empty">no moves yet</div>';
    return;
  }
  const rows = Math.ceil(history.length / 2);
  for (let i = 0; i < rows; i++){
    const row = document.createElement('div');
    row.className = 'mv';
    const n = document.createElement('span');
    n.className = 'n'; n.textContent = (i + 1) + '.';
    row.appendChild(n);
    for (let k = 0; k < 2; k++){
      const idx = i * 2 + k;
      const h = history[idx];
      const s = document.createElement('span');
      s.className = 'm';
      if (h){
        const lead = h.san[0].toLowerCase();
        if (FIG[lead]){
          s.innerHTML = '<span class="fig">' + FIG[lead] + '</span>' + h.san.slice(1);
        } else {
          s.textContent = h.san;
        }
        if (idx === history.length - 1) s.classList.add('cur');
        if (h.cls && h.cls !== 'opp'){
          const g = document.createElement('span');
          g.className = 'g ' + h.cls;
          g.textContent = GLYPH[h.cls] || '·';
          s.appendChild(g);
        }
        s.title = 'revert to this move';
        s.onclick = () => jumpTo(idx + 1);
      }
      row.appendChild(s);
    }
    el.appendChild(row);
  }
  el.scrollTop = el.scrollHeight;
}

function jumpTo(ply){
  if (busy || reviewing) return;
  cancelAuto();
  const target = history.slice(0, ply);
  const g = new Chess();
  for (const h of target){
    if (!g.move({ from: h.from, to: h.to, promotion: h.promotion || 'q' })) break;
  }
  // always land on the player's turn
  let trimmed = target;
  if (g.turn() !== playerColor && trimmed.length){
    const last = trimmed[trimmed.length - 1];
    g.undo(); trimmed = trimmed.slice(0, -1);
  }
  game.load(g.fen());
  history = trimmed;
  lastMove = history.length ? { from: history[history.length-1].from, to: history[history.length-1].to } : null;
  gameOver = false; preEval = null; selected = null; legalForSel = []; premove = null; clearArrow();
  document.getElementById('prog').classList.remove('on');
  renderMoves(); render();
  say('rewound. no judgement. okay, maybe a little.');
  refreshBaseline();
}

async function refreshBaseline(){
  const fen = game.fen();
  const res = await analyze(fen, 0, T.gradeMs);
  const w = evalWhite(res, fen);
  preEval = playerPov(w);
  paintEval(w);
}

function cancelAuto(){ clearTimeout(autoTimer); autoTimer = null; }

/* ---------------- undo ---------------- */
async function undo(){
  if (busy || reviewing) return;
  cancelAuto();
  if (!history.length) return;
  let plies = 1;
  if (history[history.length-1].color !== playerColor && history.length >= 2) plies = 2;

  for (let i = 0; i < plies; i++){ game.undo(); history.pop(); }
  const h = history[history.length-1];
  lastMove = h ? { from: h.from, to: h.to } : null;
  gameOver = false; selected = null; legalForSel = []; clearArrow();
  renderMoves(); render();
  say('took it back. we don\'t talk about it.');
  setRate('reverted', 'forced', 'Move undone.');
  await refreshBaseline();
  scheduleAuto();
}

/* ---------------- hint ---------------- */
async function hint(){
  if (busy || reviewing || gameOver) return;
  if (game.turn() !== playerColor) return;

  // second press reuses the first search so the answer can't change under you
  if (hintArmed && hintCache){
    const from = hintCache.slice(0,2), to = hintCache.slice(2,4);
    const tmp = new Chess(game.fen());
    const mv = tmp.move({ from, to, promotion: hintCache.length > 4 ? hintCache[4] : 'q' });
    hintArmed = false;
    say(`fine — ${mv ? mv.san : from + to}. i'm no grandmaster, but i'd play that.`);
    hintCache = null;
    return;
  }

  // theory first: a book move costs nothing and is a better hint than a search
  const book = ENGINE.book(game.fen());
  if (book){
    const from = book.uci.slice(0, 2);
    const piece = game.get(from);
    const cell = boardEl.querySelector(`[data-sq="${from}"]`);
    if (cell) cell.classList.add('hint');
    hintCache = book.uci;
    hintArmed = true;
    say(`${book.name} is theory. look at your ${piece ? NAME[piece.type] : 'piece'} on ${book.uci.slice(0, 2)}. ` +
        'press hint again to just say it.');
    return;
  }

  say('gimme a sec…');
  const res = await analyze(game.fen(), 0, T.hintMs, null, { minCachedDepth: 14 });
  if (!res.best || res.best === '(none)'){ say("i've got nothing. worrying for both of us."); return; }

  const from = res.best.slice(0,2), to = res.best.slice(2,4);
  const piece = game.get(from);
  drawArrow(from, to);
  hintCache = res.best;
  hintArmed = true;
  say(`look at your ${piece ? NAME[piece.type] : 'piece'} on ${from}. there's something there. press hint again to just say it.`);
}

/* ---------------- game end + deep review ---------------- */
function endGame(){
  gameOver = true;
  busy = false;
  statusBar();
  render();
  let msg;
  if (game.in_checkmate()){
    msg = game.turn() === playerColor
      ? "checkmate. that's you done. hey — i've been there. most days, actually."
      : "checkmate! you got me. good game, genuinely.";
  } else if (game.in_draw()) msg = 'draw. fine by me, i was getting nervous.';
  else msg = "game's over.";
  if (!SETTINGS.review){
    say(msg);
    setRate('done', 'forced', 'New game when you want another.');
    return;
  }
  say(msg + ' give me a minute to go through it properly.');
  setRate('review', 'forced', 'Analyzing the whole game…');
  reviewGame();
}

async function reviewGame(){
  if (!history.length) return;
  reviewing = true; cancelReview = false;
  const prog = document.getElementById('prog'), bar = document.getElementById('progBar');
  prog.classList.add('on'); bar.style.width = '0%';
  statusBar();

  const fens = history.map(h => h.fenBefore).concat([game.fen()]);
  const evals = [];

  for (let i = 0; i < fens.length; i++){
    if (cancelReview) break;
    const r = await analyze(fens[i], 0, T.reviewMs);
    evals.push(evalWhite(r, fens[i]));
    bar.style.width = (((i + 1) / fens.length) * 100).toFixed(1) + '%';
    setRate('review', 'forced', `Move ${i + 1} of ${fens.length}…`);
  }

  if (!cancelReview){
    for (let i = 0; i < history.length; i++){
      if (evals[i] === undefined || evals[i+1] === undefined) continue;
      const mover = history[i].color;
      const before = mover === 'w' ? evals[i] : -evals[i];
      const after  = mover === 'w' ? evals[i+1] : -evals[i+1];
      const loss = Math.max(0, before - after);
      const fromSq = history[i].from, toSq = history[i].to;
      let cls = history[i].onlyMove ? 'forced' : classify(loss, false);
      if (mover !== playerColor) cls = 'opp';
      history[i].cls = cls;
      history[i].cpLoss = loss;
    }
  }

  reviewing = false;
  prog.classList.remove('on');
  renderMoves();

  if (cancelReview) return;
  const acc = accuracy();
  const worst = history.filter(h => h.color === playerColor && h.cls === 'blunder').length;
  const best = history.filter(h => h.color === playerColor && h.cls === 'best').length;

  paintEval(evals[evals.length-1] !== undefined ? evals[evals.length-1] : 0);
  say(`done. accuracy <b>${acc === null ? '—' : acc + '%'}</b>, ${best} best move${best === 1 ? '' : 's'}` +
      (worst ? `, ${worst} blunder${worst === 1 ? '' : 's'}` : ', no blunders') +
      `. i'm not a pro, but that's a real game.`);
  setRate('review done', 'best', `Accuracy <b>${acc === null ? '—' : acc + '%'}</b>. Click a move to revisit it.`);
  statusBar();
}

function accuracy(){
  const rated = history.filter(h => h.color === playerColor && h.cls && h.cls !== 'opp');
  if (!rated.length) return null;
  const pts = { best:100, excellent:92, good:80, inaccuracy:62, mistake:38, blunder:12, forced:72 };
  const sum = rated.reduce((s, h) => s + (pts[h.cls] !== undefined ? pts[h.cls] : 60), 0);
  return Math.round(sum / rated.length);
}

/* ---------------- new game ---------------- */
async function newGame(){
  if (SETTINGS.confirm && history.length && !gameOver){
    if (!window.confirm('Abandon this game and start a new one?')) return;
  }
  cancelReview = true;
  cancelAuto();
  playerColor = document.getElementById('color').value;
  orientation = playerColor;
  game.reset();
  history = []; lastMove = null; selected = null; legalForSel = [];
  gameOver = false; busy = false; hintArmed = false; preEval = null;
  document.querySelectorAll('.badge').forEach(b => b.remove());
  document.getElementById('prog').classList.remove('on');
  clearArrow(); buildBoard(); render(); renderMoves(); paintEval(0);
  setRate('new game', 'forced', 'Good luck. Sincerely.');
  say(playerColor === 'w' ? "your move. i'm not a pro — i'm just loud." : "i'll start then. be gentle.");
  await refreshBaseline();
  if (game.turn() !== playerColor) await engineReplyOnce();
  scheduleAuto();
}

async function engineReplyOnce(){
  busy = true; statusBar('thinking');
  const mv = await engineMove();
  busy = false; statusBar();
  if (!mv) return;
  const from = mv.slice(0,2), to = mv.slice(2,4), promo = mv.length > 4 ? mv[4] : 'q';
  const fenB = game.fen();
  const m = game.move({ from, to, promotion: promo });
  if (m){
    lastMove = { from, to };
    history.push({ san: m.san, from, to, promotion: promo, color: m.color,
                   cls: 'opp', cpLoss: 0, fenBefore: fenB, onlyMove: false });
    renderMoves(); render();
  }
}

/* ---------------- talking to Ray ---------------- */
/* No network, no API key: Ray reads the position and answers. */
function rayCtx(){
  const last = history[history.length - 1];
  return {
    eval: fmt(lastEval || 0), evalText: fmt(lastEval || 0),
    n: Math.floor(history.length / 2) + 1,
    accuracy: accuracy(),
    san: last ? last.san : '', to: last ? last.to : '?'
  };
}
function reply(text){ return Ray.chat(text, rayCtx()); }

function sendChat(){
  const inp = document.getElementById('chatIn');
  if (!inp) return;
  const v = inp.value.trim(); if (!v) return;
  inp.value = '';
  if (/^(hint|help|\?+|h)$/i.test(v) || /\bgive me a hint\b/i.test(v)){ hint(); return; }
  say(reply(v));
}

/* ---------------- misc ---------------- */
let ac = null;
function click(kind){
  if (!SETTINGS.sound) return;
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.connect(g); g.connect(ac.destination);
    const t = ac.currentTime;
    o.type = 'triangle';
    o.frequency.setValueAtTime(kind === 'cap' ? 180 : 300, t);
    o.frequency.exponentialRampToValueAtTime(kind === 'cap' ? 110 : 220, t + .06);
    g.gain.setValueAtTime(.045, t);
    g.gain.exponentialRampToValueAtTime(.0006, t + .1);
    o.start(t); o.stop(t + .11);
  } catch(e){}
}

};

/* settings wiring */
const SETMAP = { setThreats:'threats', setDots:'dots', setCoords:'coords', setSound:'sound',
                 setEval:'eval', setTalk:'talk', setReview:'review', setConfirm:'confirm' };
Object.keys(SETMAP).forEach(id => {

  if (!el) return;
  el.onchange = () => {
    SETTINGS[SETMAP[id]] = el.checked;
    saveSettings();
    applySettings();
    render();
  };
});
document.querySelectorAll('.theme-dot').forEach(btn => {
  btn.onclick = () => {
    SETTINGS.theme = btn.dataset.theme;
    saveSettings();
    applySettings();
  };
});

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  const k = e.key.toLowerCase();
  if (k === 'h') hint();
  if (k === 'u') undo();
  if (k === 'n') newGame();
  if (k === 'f'){ orientation = orientation === 'w' ? 'b' : 'w'; buildBoard(); render(); }
  if (k === 't'){ SETTINGS.threats = !SETTINGS.threats; saveSettings(); applySettings(); render(); }
});

document.getElementById('avatar').innerHTML = `<svg viewBox="0 0 48 48" width="46" height="46">

  <path d="M13 45c2.4-4.8 6.6-6.8 11-6.8s8.6 2 11 6.8" fill="#3f6b4a"/>

/* ---------------- boot ---------------- */
buildBoard(); render(); renderMoves();
document.getElementById('lvVal').textContent = diffLabel(difficulty());
document.getElementById('lvlTag').textContent = diffName(difficulty()).toUpperCase();
applySettings();

setRate('booting', 'forced', 'Warming up the engine…');
say('One sec — starting stockfish. I\'m not fast, I\'m honest.');

initEngine().then(async () => {
  say("Engine's alive. I'm Ray — decent club player, much better heckler. Your move.");
  setRate('ready', 'forced', "Make a move — I'll rate it instantly.");
  const res = await analyze(game.fen(), 0, T.gradeMs);
  const w = evalWhite(res, game.fen());
  preEval = playerPov(w);
  paintEval(w);
  if (game.turn() !== playerColor) engineReplyOnce();
  scheduleAuto();
}).catch(() => {
  say('Engine failed to start. That\'s on me — it needs to be served over http, not opened as a file.');
  setEng(false);
});
